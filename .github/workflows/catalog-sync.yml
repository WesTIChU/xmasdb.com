name: Sync Catalog Manifest

on:
  push:
    paths:
      - catalog/movies.json
      - .github/workflows/catalog-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog manifest
        run: npm run catalog:manifest:check

      - name: Sync catalog through shared TMDB importer
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run catalog:manifest:sync

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit generated catalog output
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync catalog from manifest"
          git push origin HEAD:main

name: Sync Catalog Manifest

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 2 * * *'
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Catalog operation
        required: true
        default: manifest
        type: choice
        options:
          - manifest
          - coming-soon
          - collection

permissions:
  contents: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog manifest
        run: npm run catalog:manifest:check

      - name: Run catalog operation through shared TMDB importer
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CATALOG_OPERATION: ${{ inputs.operation }}
          CATALOG_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$CATALOG_OPERATION" == "manifest" || "$CATALOG_SCHEDULE" == "*/15 * * * *" ]]; then
            npm run catalog:manifest:sync
          elif [[ "$CATALOG_SCHEDULE" == "0 2 * * *" || "$CATALOG_OPERATION" == "coming-soon" ]]; then
            npm run catalog:refresh -- --coming-soon-only
          else
            npm run catalog:refresh -- --collection-only
          fi

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit generated catalog output
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync catalog from manifest"
          git push origin HEAD:main

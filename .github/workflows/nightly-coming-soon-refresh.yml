name: XmasDB Coming Soon refresh

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: generated-main-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out XmasDB
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore refresh history for this run
        run: |
          mkdir -p data
          if [ -f src/data/tmdb-refresh-history.json ]; then cp src/data/tmdb-refresh-history.json data/tmdb-refresh-history.json; fi

      - name: Refresh Coming Soon metadata and images
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: https://images.xmasdb.com
        run: npm run refresh:tmdb -- --coming-soon-only

      - name: Publish homepage poster derivatives to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: https://images.xmasdb.com
        run: npm run images:r2:publish-homepage

      - name: Validate local data
        run: |
          npm run audit:local
          npm test
          npm run typecheck

      - name: Persist refreshed catalogue and artwork
        run: |
          if [ -f data/tmdb-refresh-history.json ]; then cp data/tmdb-refresh-history.json src/data/tmdb-refresh-history.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/movies.ts src/data/actors.json src/data/refresh-report.json src/data/tmdb-refresh-history.json src/data/homepage-poster-ids.ts public/images
          if git diff --cached --quiet; then
            echo "No Coming Soon metadata or artwork changes to commit."
          else
            git commit -m "Refresh Coming Soon TMDB metadata"
            .github/scripts/push-generated-commit.sh origin main
          fi
